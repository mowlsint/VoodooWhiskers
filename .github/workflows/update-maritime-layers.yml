name: Update maritime layers

on:
  # Owner-authorized collection windows; all cron times are UTC.
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voodoo-maritime-layers-main
  cancel-in-progress: false

jobs:
  build-layers:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ais.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements-ais.txt

      - name: Check AIS collector imports without provider calls
        run: |
          python - <<'PYTHON'
          import sys
          sys.path.insert(0, "scripts")
          import collect_ais
          import merge_ais_contacts
          print("AIS collector import check passed; no provider requests made.")
          PYTHON

      - name: Refresh official vessel designations at most once per day
        continue-on-error: true
        run: python scripts/refresh_sanctions.py --fetch

      - name: Collect Open Waters and regional AIS in one window
        env:
          OPENWATERS_TOKEN: ${{ secrets.OPENWATERS_TOKEN }}
          BARENTSWATCH_CLIENT_ID: ${{ secrets.BARENTSWATCH_CLIENT_ID }}
          BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}
        run: python scripts/collect_ais.py

      - name: Archive bounded filtered observations
        run: python scripts/archive_maritime_snapshots.py

      - name: Build layers
        env:
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/build_layers.py

      - name: Validate bounded 14-day VOI history
        run: |
          set -euo pipefail
          python scripts/test_voi_history_policy_unit.py
          python scripts/test_voi_history_retention.py --source-only

      - name: Audit sanctions/watchlist inputs
        run: |
          set -euo pipefail
          python scripts/sync_sanctions_watchlists.py

      - name: Build public products and existing delayed snapshot
        run: |
          set -euo pipefail
          python scripts/build_public_outputs.py
          python scripts/analyze_infrastructure_proximity.py
          python scripts/build_common_maritime_snapshot.py
          python scripts/build_public_manifest.py

      - name: Commit updated outputs
        env:
          NTFY_ENABLED: ${{ secrets.NTFY_ENABLED }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          set -euo pipefail

          send_push_failure_ntfy() {
            if [ "${NTFY_ENABLED:-false}" != "true" ] || [ -z "${NTFY_URL:-}" ]; then
              echo "ntfy disabled or URL missing; not sending push-failure notification."
              return 0
            fi

            BODY="$(printf 'VOODOO WHISKERS // maritime layers push failed\n\nWorkflow: %s\nRun: %s\nBranch: %s\n\nLayer build completed, but push failed after 3 attempts. The next scheduled run will rebuild and try again. Magic Paws VOI data may remain stale until the next successful Voodoo layer update.\n' "${GITHUB_WORKFLOW:-Update maritime layers}" "${GITHUB_RUN_ID:-unknown}" "${GITHUB_REF_NAME:-main}")"

            if [ -n "${NTFY_TOKEN:-}" ]; then
              curl -fsSL \
                -H "Authorization: Bearer ${NTFY_TOKEN}" \
                -H "Title: VOODOO WHISKERS Push Failed" \
                -H "Priority: high" \
                -H "Tags: warning,ship" \
                --data-binary "$BODY" \
                "$NTFY_URL" || true
            else
              curl -fsSL \
                -H "Title: VOODOO WHISKERS Push Failed" \
                -H "Priority: high" \
                -H "Tags: warning,ship" \
                --data-binary "$BODY" \
                "$NTFY_URL" || true
            fi
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Refusing production writes from a non-main branch."
            exit 1
          fi

          # Required outputs must exist. The AISstream provider snapshot is optional:
          # on a failed first-ever AISstream test there is no file yet, while the
          # regional provider merge and generated layers are still valid.
          required_outputs=(
            data/ais_contacts_latest.json
            data/russian_mmsi.geojson
            data/watchlist_live.geojson
            data/sanctions_shadowfleet.geojson
            data/falseflag_interest.geojson
            data/false_flag_watch.geojson
            data/behavioral_voi.geojson
            data/recent_russian_portcall_10d.geojson
            data/neutral_tanker_context.geojson
            data/tanker_cluster_stats.json
            data/voi_snapshot_latest.json
            data/voi_history.jsonl
            data/voi_history_status.json
            data/voi_stats_by_slot.json
            data/watchlist_audit.json
            data/watchlist_changes_latest.md
          )

          for path in "${required_outputs[@]}"; do
            if [ ! -f "$path" ]; then
              echo "ERROR: required output missing: $path"
              exit 1
            fi
          done

          git add -- "${required_outputs[@]}"

          if [ -d data/voi_history_14d ]; then
            git add -- data/voi_history_14d
          else
            echo "ERROR: canonical VOI history shard directory missing: data/voi_history_14d"
            exit 1
          fi

          for path in data/gfw_historical_ais_latest.json data/gfw_historical_ais_status_latest.json data/gfw_presence_cells_latest.json data/gfw_events_latest.json data/gfw_context_status_latest.json data/watchlist_master.csv data/sanctions_sources data/sanctions_refresh_status_latest.json data/ais_contacts_openwaters_latest.json data/ais_openwaters_fetch_status_latest.json data/ais_contacts_fintraffic_latest.json data/ais_contacts_barentswatch_latest.json data/ais_regional_fetch_status_latest.json data/russian_route_state.json data/russian_portcall_history.jsonl data/history data/maritime_common_snapshot_latest.json data/maritime_common_snapshot_status_latest.json public; do
            [ ! -e "$path" ] || git add -- "$path"
          done

          if ! git diff --quiet; then
            echo "::error::Tracked changes remain unstaged; refusing to hide or discard them."
            git diff --name-only
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No maritime layer changes to commit."
            exit 0
          fi

          python scripts/repo_storage_guard.py
          git commit -m "Update maritime layers"

          for i in 1 2 3; do
            echo "Push attempt ${i}/3..."

            if git fetch --deepen=1 origin main && git rebase FETCH_HEAD && git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push attempt ${i}/3 failed."
            git rebase --abort || true

            if [ "$i" -lt 3 ]; then
              echo "Waiting before retry..."
              sleep 12
            fi
          done

          echo "ERROR: Push failed after 3 attempts."
          send_push_failure_ntfy
          exit 1

      # Current positions have already passed the guard and reached main.
      # A history failure cannot roll back that successful publication.
      - name: Build and validate public history after publishing current positions
        run: |
          set -euo pipefail
          python scripts/build_public_outputs.py --include-history
          python scripts/analyze_infrastructure_proximity.py
          python scripts/build_public_manifest.py
          python scripts/test_voi_history_retention.py --public-only

      - name: Commit public history within its own storage budget
        run: bash scripts/commit_public_history.sh

