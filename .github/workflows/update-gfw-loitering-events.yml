name: Update GFW loitering events

on:
  # Also verify/publish after targeted workflow or guard changes.
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-gfw-loitering-events.yml"
      - "scripts/repo_storage_guard.py"
      - "tests/test_repo_storage_guard.py"
      - "scripts/fetch_gfw_context.py"
      - "scripts/build_public_outputs.py"
      - "scripts/build_public_manifest.py"
      - "scripts/gfw_event_shards.py"
      - "tests/test_gfw_event_shards.py"
      - "tests/test_gfw_event_shards.cjs"
      - "public/assets/gfw-events.js"
      - "public/assets/infrastructure-watch.js"
      - "public/index.html"
  # Run after the daily AIS and presence windows; event pagination is isolated from AIS ingestion.
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voodoo-maritime-layers-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore latest bounded live data
        run: python scripts/runtime_data_store.py restore

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3"

      - name: Verify storage-guard regression tests
        run: python -m unittest discover -s tests -p test_repo_storage_guard.py -v

      - name: Verify complete GFW event shards and map loader
        run: |
          python -m unittest discover -s tests -p test_gfw_event_shards.py -v
          node tests/test_gfw_event_shards.cjs

      - name: Fetch delayed GFW Loitering and AIS-gap events
        env:
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/fetch_gfw_context.py --events-only

      - name: Publish event products and coverage status
        run: |
          set -euo pipefail
          python scripts/build_public_outputs.py
          python scripts/build_public_manifest.py
          python -c 'import json; from pathlib import Path; p=json.loads(Path("data/gfw_events_status_latest.json").read_text()); assert p.get("historical") is True'

      - name: Commit event products
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files=(
            data/gfw_events_latest.json
            data/gfw_events_status_latest.json
            public/data/vessels/gfw_events_latest.json
            public/data/vessels/gfw_events_status_latest.json
            public/downloads/gfw_events_latest.json
            public/downloads/gfw_events_14d_manifest.json
            public/downloads/gfw_events_status_latest.json
            public/data/manifest.json
            public/downloads/manifest.json
          )
          for file in "${files[@]}"; do
            [ -e "$file" ] && git add "$file"
          done
          # Stage new and removed shard parts; never leave stale parts in runtime-data.
          if [ -d public/data/vessels/gfw_events_14d ]; then
            git add -A -- public/data/vessels/gfw_events_14d
          fi
          if git diff --cached --quiet; then
            echo "No GFW event product changes."
            exit 0
          fi
          python scripts/repo_storage_guard.py
          python scripts/runtime_data_store.py publish "Refresh delayed GFW loitering events"