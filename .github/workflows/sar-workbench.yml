name: SAR Workbench · verschlüsselter Auftrag

on:
  workflow_dispatch:
    inputs:
      encrypted_request:
        description: Verschlüsselten Auftrag aus der SAR-Arbeitsoberfläche hier einfügen
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: voodoo-sar-workbench-main
  cancel-in-progress: false

jobs:
  sar-workbench:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-sar.txt
      - name: Install bounded processing dependencies
        run: pip install --disable-pip-version-check -r requirements-sar.txt
      - name: Process one encrypted request
        id: sar
        continue-on-error: true
        env:
          SAR_ENCRYPTED_REQUEST: ${{ inputs.encrypted_request }}
          SAR_WORKBENCH_PASSWORD: ${{ secrets.SAR_WORKBENCH_PASSWORD }}
          CDSE_SH_CLIENT_ID: ${{ secrets.CDSE_SH_CLIENT_ID }}
          CDSE_SH_CLIENT_SECRET: ${{ secrets.CDSE_SH_CLIENT_SECRET }}
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
        run: python scripts/sar_workbench.py
      - name: Persist encrypted results only
        if: ${{ always() }}
        run: |
          set -euo pipefail
          result=public/data/sar/workbench.enc.json
          if [ ! -f "$result" ]; then
            echo "Kein gültiges verschlüsseltes Ergebnis vorhanden."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/data/sar/workbench.enc.json')
          assert p.stat().st_size <= 24*1024*1024
          e=json.loads(p.read_text())
          assert set(e)=={'v','purpose','kdf','iterations','salt','nonce','ciphertext'}
          assert e['v']==1 and e['purpose']=='workspace' and e['iterations']==600000
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$result"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update encrypted SAR workbench"
          for attempt in 1 2 3; do
            if git fetch --deepen=1 origin main && git rebase FETCH_HEAD && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
          done
          exit 1
      - name: Report processing status
        if: ${{ steps.sar.outcome == 'failure' }}
        run: |
          echo "::error::Auftrag nicht abgeschlossen. Passwort/Secret prüfen oder verschlüsselte Fehlerdetails in der SAR-Oberfläche öffnen."
          exit 1
