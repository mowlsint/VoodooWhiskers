name: Build bounded public VOI history

on:
  # LOW ACTIONS MODE 2026-08-27: automatic triggers are paused.
  # Restore details: docs/operations/AUTOMATIC_ACTIONS_PAUSE_2026-08-27.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voodoo-public-products-main
  cancel-in-progress: false

jobs:
  build-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore latest bounded live data
        run: python scripts/runtime_data_store.py restore

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build bounded 14-day history and derived products
        run: |
          set -euo pipefail
          python scripts/build_public_outputs.py --include-history
          python scripts/analyze_infrastructure_proximity.py
          python scripts/build_public_manifest.py
          node --check public/assets/infrastructure-watch.js

      - name: Validate bounded 14-day history
        run: |
          set -euo pipefail
          python scripts/test_voi_history_retention.py --public-only

      - name: Commit bounded history products
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/vessels/voi_history_14d.jsonl \
            public/data/vessels/voi_history_14d \
            public/data/vessels/manifest.json \
            public/data/analysis \
            public/downloads \
            public/data/manifest.json
          if git diff --cached --quiet; then
            echo "No bounded-history changes to commit."
            exit 0
          fi
          python scripts/repo_storage_guard.py
          python scripts/runtime_data_store.py publish "Build bounded 14-day public VOI history"