name: Probe GFW common AIS presence

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voodoo-maritime-layers-main
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3"

      - name: Fetch bounded GFW common presence
        env:
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/fetch_gfw_context.py

      - name: Archive current regional and Danish snapshots
        run: |
          set -euo pipefail
          python scripts/archive_maritime_snapshots.py

      - name: Build common maritime snapshot
        run: |
          set -euo pipefail
          python scripts/build_common_maritime_snapshot.py
          python scripts/build_public_manifest.py

      - name: Publish delayed context separately from AIS contacts
        run: |
          set -euo pipefail
          python scripts/build_public_outputs.py
          python scripts/build_public_manifest.py
          python -c 'import json; from pathlib import Path; p=json.loads(Path("data/gfw_context_status_latest.json").read_text()); assert p["historical"] is True'

      - name: Commit derived products
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files=(
            public/data/vessels
            public/downloads
            data/gfw_presence_cells_latest.json
            data/gfw_events_latest.json
            data/gfw_context_status_latest.json
            data/gfw_historical_ais_latest.json
            data/gfw_historical_ais_status_latest.json
            data/history/maritime_source_history_21d.jsonl
            data/history/maritime_source_coverage_21d.jsonl
            data/history/maritime_source_history_status_latest.json
            data/maritime_common_snapshot_latest.json
            data/maritime_common_snapshot_status_latest.json
            public/data/vessels/maritime_common_snapshot_latest.json
            public/data/vessels/maritime_common_snapshot_latest.geojson
            public/data/vessels/maritime_common_snapshot_status.json
            public/downloads/maritime_common_snapshot_latest.json
            public/downloads/maritime_common_snapshot_latest.geojson
            public/downloads/maritime_common_snapshot_status.json
            public/data/manifest.json
            public/downloads/manifest.json
          )
          for file in "${files[@]}"; do
            [ -e "$file" ] && git add "$file"
          done
          if git diff --cached --quiet; then
            echo "No GFW/common snapshot changes."
            exit 0
          fi
          git commit -m "Add harmonized maritime common snapshot"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            [ "$attempt" -lt 3 ] && sleep 12
          done
          exit 1

