name: Update GFW SAR, historical AIS and common snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "35 5 * * *"

permissions:
  contents: write

concurrency:
  # Serialize all Voodoo maritime writers so GFW, regional AIS and public products
  # never commit competing versions at the same time.
  group: voodoo-maritime-layers-main
  cancel-in-progress: false

jobs:
  update-gfw-products:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
      SAR_GFW_LOOKBACK_DAYS: "14"
      SAR_GFW_DATA_LAG_DAYS: "5"
      SAR_GFW_MAX_FEATURES: "12000"
      SAR_GFW_AIS_CONTEXT_MAX_VESSELS: "150"
      SAR_GFW_AIS_CONTEXT_BATCH_SIZE: "50"
      SAR_GFW_AIS_CONTEXT_MAX_DELTA_MINUTES: "60"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependency
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "requests>=2.32,<3"

      - name: Require Global Fishing Watch token
        run: |
          set -euo pipefail
          if [ -z "${GFW_TOKEN:-}" ]; then
            echo "::error::Repository secret GFW_TOKEN is missing."
            exit 1
          fi

      - name: Fetch delayed SAR detections and corresponding historical AIS presence
        run: |
          set -euo pipefail
          python scripts/fetch_gfw_sar.py

      - name: Fetch bounded GFW common AIS presence
        run: |
          set -euo pipefail
          python scripts/fetch_gfw_common_presence.py

      - name: Archive current regional and Danish snapshots
        run: |
          set -euo pipefail
          python scripts/archive_maritime_snapshots.py

      - name: Build harmonized common maritime snapshot and manifests
        run: |
          set -euo pipefail
          python scripts/build_common_maritime_snapshot.py
          python scripts/build_public_manifest.py

      - name: Validate SAR and common snapshot products
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/fetch_gfw_sar.py \
            scripts/fetch_gfw_common_presence.py \
            scripts/archive_maritime_snapshots.py \
            scripts/build_common_maritime_snapshot.py \
            scripts/build_public_manifest.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = [
              Path('data/sar_gfw_latest.json'),
              Path('data/sar_gfw_status_latest.json'),
              Path('data/sar_gfw_ais_context_latest.json'),
              Path('data/gfw_historical_ais_latest.json'),
              Path('data/gfw_historical_ais_status_latest.json'),
              Path('data/maritime_common_snapshot_latest.json'),
              Path('data/maritime_common_snapshot_status_latest.json'),
              Path('public/data/vessels/sar_detections_latest.geojson'),
              Path('public/data/vessels/sar_ais_context_latest.geojson'),
              Path('public/data/vessels/sar_import_status.json'),
              Path('public/data/vessels/maritime_common_snapshot_latest.json'),
              Path('public/data/vessels/maritime_common_snapshot_latest.geojson'),
              Path('public/data/vessels/maritime_common_snapshot_status.json'),
              Path('public/downloads/sar_detections_latest.geojson'),
              Path('public/downloads/sar_ais_context_latest.geojson'),
              Path('public/downloads/sar_import_status.json'),
              Path('public/downloads/maritime_common_snapshot_latest.json'),
              Path('public/downloads/maritime_common_snapshot_latest.geojson'),
              Path('public/downloads/maritime_common_snapshot_status.json'),
              Path('public/downloads/manifest.json'),
              Path('public/data/manifest.json'),
          ]
          token = os.environ.get('GFW_TOKEN', '')
          for path in required:
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f'missing or empty product: {path}')
              if path.stat().st_size > 25 * 1024 * 1024:
                  raise SystemExit(f'product exceeds 25 MiB: {path}')
              text = path.read_text(encoding='utf-8')
              if token and token in text:
                  raise SystemExit(f'GFW token leaked into {path}')
              json.loads(text)

          sar_geo = json.loads(Path('public/data/vessels/sar_detections_latest.geojson').read_text(encoding='utf-8'))
          context = json.loads(Path('public/data/vessels/sar_ais_context_latest.geojson').read_text(encoding='utf-8'))
          if sar_geo.get('type') != 'FeatureCollection' or context.get('type') != 'FeatureCollection':
              raise SystemExit('SAR outputs must be GeoJSON FeatureCollections')
          if context.get('current_ais_must_not_be_overlaid') is not True:
              raise SystemExit('SAR-AIS context must explicitly prohibit current AIS overlay')

          gfw_status = json.loads(Path('data/gfw_historical_ais_status_latest.json').read_text(encoding='utf-8'))
          if int(gfw_status.get('count') or 0) <= 0:
              raise SystemExit('GFW common-presence query returned zero contacts')
          if not gfw_status.get('data_max_timestamp_utc'):
              raise SystemExit('GFW common-presence query returned no data watermark')

          common_status = json.loads(Path('data/maritime_common_snapshot_status_latest.json').read_text(encoding='utf-8'))
          if not common_status.get('snapshot_at'):
              raise SystemExit('common snapshot has no snapshot_at watermark')

          print(json.dumps({
              'gfw_count': gfw_status.get('count'),
              'snapshot_status': common_status.get('status'),
              'ais_status_color': common_status.get('ais_status_color'),
              'snapshot_at': common_status.get('snapshot_at'),
              'snapshot_count': common_status.get('count'),
          }, indent=2))
          PY

      - name: Commit derived GFW, common snapshot and manifest products
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=(
            data/sar_gfw_latest.json
            data/sar_gfw_status_latest.json
            data/sar_gfw_ais_context_latest.json
            data/gfw_historical_ais_latest.json
            data/gfw_historical_ais_status_latest.json
            data/history/maritime_source_history_21d.jsonl
            data/history/maritime_source_coverage_21d.jsonl
            data/history/maritime_source_history_status_latest.json
            data/maritime_common_snapshot_latest.json
            data/maritime_common_snapshot_status_latest.json
            public/data/vessels/sar_detections_latest.geojson
            public/data/vessels/sar_ais_context_latest.geojson
            public/data/vessels/sar_import_status.json
            public/data/vessels/maritime_common_snapshot_latest.json
            public/data/vessels/maritime_common_snapshot_latest.geojson
            public/data/vessels/maritime_common_snapshot_status.json
            public/downloads/sar_detections_latest.geojson
            public/downloads/sar_ais_context_latest.geojson
            public/downloads/sar_import_status.json
            public/downloads/maritime_common_snapshot_latest.json
            public/downloads/maritime_common_snapshot_latest.geojson
            public/downloads/maritime_common_snapshot_status.json
            public/downloads/manifest.json
            public/data/manifest.json
          )
          for file in "${files[@]}"; do
            [ -e "$file" ] && git add "$file"
          done

          if git diff --cached --quiet; then
            echo "No GFW/common snapshot changes to commit."
            exit 0
          fi

          git commit -m "Update GFW SAR and harmonized maritime snapshot"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            [ "$attempt" -lt 3 ] && sleep 12
          done
          echo "::error::Failed to push GFW/common snapshot products after 3 attempts."
          exit 1
