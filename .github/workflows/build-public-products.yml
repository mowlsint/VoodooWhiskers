name: Build public Voodoo products (lightweight)

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update maritime layers
      - Update regional AIS layers
      - Update Danish historical AIS
      - Update GFW SAR detections
    types: [completed]

permissions:
  contents: write

concurrency:
  group: voodoo-public-products-main
  cancel-in-progress: false

jobs:
  build-public-products:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build public vessel products (history unchanged)
        run: |
          set -euo pipefail
          python scripts/build_public_outputs.py

      - name: Build infrastructure analysis
        run: |
          set -euo pipefail
          python scripts/analyze_infrastructure_proximity.py

      - name: Build public manifests
        run: |
          set -euo pipefail
          python scripts/build_public_manifest.py

      - name: Validate public products
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/build_public_outputs.py \
            scripts/analyze_infrastructure_proximity.py \
            scripts/build_public_manifest.py \
            scripts/fetch_aisdk_historical.py \
            scripts/fetch_gfw_sar.py
          node --check public/assets/infrastructure-watch.js
          node --check public/assets/sar-map-hook.js
          node --check public/assets/sar-layer.js
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              'public/data/manifest.json',
              'public/data/vessels/voi_snapshot_latest.json',
              'public/data/vessels/ais_contacts_latest.json',
              'public/data/vessels/ais_contacts_latest.geojson',
              'public/data/vessels/vessel_positions_latest.geojson',
              'public/data/analysis/infrastructure_events_latest.json',
              'public/downloads/manifest.json',
              'public/downloads/voi_list_latest.json',
              'public/index.html',
              'public/assets/sar-map-hook.js',
              'public/assets/sar-layer.js',
              'public/assets/sar-layer.css',
          ]
          for name in required:
              path = Path(name)
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f'missing or empty: {name}')
              if path.suffix in {'.json', '.geojson'}:
                  json.loads(path.read_text(encoding='utf-8'))

          dk_source = Path('data/ais_contacts_aisdk_historical_latest.json')
          if dk_source.exists():
              dk_required = [
                  Path('public/data/vessels/ais_dk_last_two_positions.json'),
                  Path('public/data/vessels/ais_dk_last_two_positions.geojson'),
                  Path('public/data/vessels/ais_dk_import_status.json'),
                  Path('public/downloads/ais_dk_last_two_positions.json'),
                  Path('public/downloads/ais_dk_last_two_positions.geojson'),
                  Path('public/downloads/ais_dk_import_status.json'),
              ]
              for path in dk_required:
                  if not path.exists() or path.stat().st_size == 0:
                      raise SystemExit(f'missing or empty Danish product: {path}')
                  if path.stat().st_size > 25 * 1024 * 1024:
                      raise SystemExit(f'Danish public product too large: {path} ({path.stat().st_size} bytes)')
                  json.loads(path.read_text(encoding='utf-8'))

          sar_source = Path('data/sar_gfw_latest.json')
          if sar_source.exists():
              sar_required = [
                  Path('public/data/vessels/sar_detections_latest.geojson'),
                  Path('public/data/vessels/sar_import_status.json'),
                  Path('public/downloads/sar_detections_latest.geojson'),
                  Path('public/downloads/sar_import_status.json'),
              ]
              for path in sar_required:
                  if not path.exists() or path.stat().st_size == 0:
                      raise SystemExit(f'missing or empty SAR product: {path}')
                  if path.stat().st_size > 25 * 1024 * 1024:
                      raise SystemExit(f'SAR public product too large: {path} ({path.stat().st_size} bytes)')
                  json.loads(path.read_text(encoding='utf-8'))

          download_manifest_path = Path('public/downloads/manifest.json')
          download_manifest = json.loads(download_manifest_path.read_text(encoding='utf-8'))
          for product in download_manifest.get('products', []):
              href = str(product.get('href') or '').strip()
              if not href or '://' in href or href.startswith('/'):
                  raise SystemExit(f'invalid download href: {href!r}')
              target = (download_manifest_path.parent / href).resolve()
              root = download_manifest_path.parent.resolve()
              if target.parent != root:
                  raise SystemExit(f'download href escapes directory: {href}')
              if not target.exists() or target.stat().st_size == 0:
                  raise SystemExit(f'broken download href: {href} -> {target}')
              declared_size = product.get('size_bytes')
              if declared_size is not None and int(declared_size) != target.stat().st_size:
                  raise SystemExit(f'download size mismatch: {href}')
              if target.suffix in {'.json', '.geojson'}:
                  json.loads(target.read_text(encoding='utf-8'))

          forbidden = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              lower = path.name.lower()
              if (lower.startswith('aisdk-') and lower.endswith(('.zip', '.csv'))) or 'data/raw' in path.as_posix() or 'tmp/aisdk' in path.as_posix():
                  forbidden.append(str(path))
          if forbidden:
              raise SystemExit('raw Danish AIS files found in repository: ' + ', '.join(forbidden))
          print('public product and download validation: ok')
          PY

      - name: Reject oversized public files
        run: |
          set -euo pipefail
          oversized="$(find public -type f -size +95M -print)"
          if [ -n "$oversized" ]; then
            echo "::error::Public files exceed the GitHub-safe size guard:"
            printf '%s\n' "$oversized"
            exit 1
          fi

      - name: Commit public products
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No public product changes to commit."
            exit 0
          fi
          git commit -m "Build public Voodoo Whiskers products"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            [ "$attempt" -lt 3 ] && sleep 10
          done
          echo "::error::Failed to push public products after 3 attempts."
          exit 1
